<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMMMSU SLUC - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header: logo + name, dark green line underneath -->
  <header class="site-header">
    <img class="brand-logo" src="DmmmsuLogo.png" alt="DMMMSU logo">
    <span class="brand-name">DMMMSU SLUC</span>
  </header>

  <div class="page-body">

    <!-- Navigation (sits just below the green line) -->
    <nav class="main-nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">News</a>  
    </nav>

    <!-- Left column: login form -->
    <section class="login-column">
      <form>
           <h3>Login Form</h3>
           <label>Username</label> 
           <input type="text" name="username" required></input>
           <label>Password</label>
           <input type="password" name="password" required></input>
           <button type="submit">Register</button>
        </form>
    </section>

    <!-- Right column: staggered campus images -->
    <section class="gallery-column">
      <img class="gallery-img img-top" src="sluc.jpg" alt="DMMMSU SLUC campus sign">
      <img class="gallery-img img-middle" src="dmsusluc.jpg" alt="DMMMSU SLUC campus banner">
      <img class="gallery-img img-bottom" src="slc.png" alt="DMMMSU campuses overview">
    </section>

  </div>

  <!-- Footer: dark green line + centered text -->
  <footer class="site-footer">
    <p>All Rights Reserved 2027</p>
  </footer>

</body>
</html>
